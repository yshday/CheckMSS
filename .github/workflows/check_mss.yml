name: Check MSS New Posts

on:
  schedule:
    # 평일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * 1-5'
    # 평일 오후 2시 (KST) = UTC 05:00
    - cron: '0 5 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 파일 커밋을 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python check_mss.py

      - name: Commit updated state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_checked.json
          git diff --staged --quiet || git commit -m "Update last checked state [skip ci]"
          git push
